<script type="text/javascript">
// Create IE + others compatible event handler
var eventMethod = window.addEventListener ? "addEventListener" : "attachEvent";
var eventer = window[eventMethod];
var messageEvent = eventMethod == "attachEvent" ? "onmessage" : "message";

// Listen to message from child window
eventer(messageEvent,function(e) {
    document.getElementById('SheetFrame').height = e.data.height + 'px';
    document.getElementById('SheetFrame').width = e.data.width + 'px';
},false);

Element.prototype.addClassName = function addClassName(className){
    if(!this.hasClassName(className))
        this.className += ' ' + className;
};

Element.prototype.removeClassName = function removeClassName(className){
    // Test for the simple case before using a RegExp.
    if (this.className === className)
        this.className = "";
    else
        this.removeMatchingClassNames(className.escapeForRegExp());
};

Element.prototype.removeMatchingClassNames = function removeMatchingClassNames(classNameRegex){
    var regex = new RegExp("(^|\\s+)" + classNameRegex + "($|\\s+)");
    if (regex.test(this.className))
        this.className = this.className.replace(regex, " ");
};

Element.prototype.hasClassName = function hasClassName(className){
    if (!className)
        return false;
    if (this.className === className)
        return true;
    var regex = new RegExp("(^|\\s)" + className.escapeForRegExp() + "($|\\s)");
    return regex.test(this.className);
};

String.prototype.escapeForRegExp = function escapeForRegExp(){
    return this.escapeCharacters("^[]{}()\.$*+?|");
};

String.prototype.escapeCharacters = function escapeCharacters(chars){
    var foundChar = false;
    for (var i = 0; i < chars.length; ++i) {
        if (this.indexOf(chars.charAt(i)) !== -1) {
            foundChar = true;
            break;
        }
    }

    if (!foundChar)
        return this;

    var result = "";
    for (var j = 0; j < this.length; ++j) {
        if (chars.indexOf(this.charAt(j)) !== -1)
            result += "\\";
        result += this.charAt(j);
    }

    return result;
};

var borderColor = "rgba(211,211,211,1.000000)";
var backgroundColor = "rgba(252,252,252,0.400000)";
var selectedBorderColor = "rgba(184,196,217,1.000000)";
var _tabChanged = false;
function SelectSheet(sheetNumber, sheetURL){
    _tabChanged = true;
    var navbar = document.getElementById('navbar');
    var navChildren = navbar.children;
    for (var j=0; j < navChildren.length; j++) {
        var navChild = navChildren[j];
        var navElementName = navChild.id;
        if (navElementName == ("Tab"+sheetNumber)) {
            navChild.addClassName("selected");
            document.getElementById('SheetFrame').src = sheetURL;
            navChild.style.borderLeftColor = selectedBorderColor;
            navChild.style.borderRightColor = selectedBorderColor;
        }
        else {
            if (navChild.classList.contains("selected")) {
                navChild.removeClassName("selected");
                navChild.style.borderLeftColor = backgroundColor;
            }
            if (navElementName == ("Tab"+(sheetNumber - 1))) {
                navChild.style.borderRightColor = backgroundColor;
            }
            else {
                navChild.style.borderRightColor = borderColor;
            }
        }
    }
}

function ScrollNavBar(scrollX) {
    var navBar = document.getElementById('navbar');
    navBar.scrollLeft += scrollX;
}

function ReloadFirstSheetIfNeeded(sheetURL)
{
    if (_tabChanged == false) {
        SelectSheet(0, sheetURL);
    }
}

.navpane-sheet.selected {color: rgba(63,143,235,1.000000); background-color: rgba(209,230,255,0.800000); border-color: rgba(184,196,217,1.000000);}
