name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run by hand on any branch (Actions ▸ CI ▸ Run workflow), without opening a pull request.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: DirnexCore (swift test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Test DirnexCore
        run: swift test --package-path DirnexCore
      - name: Performance budgets (release)
        # The M1 hot-path budgets (PerformanceBudgetTests) only enforce in optimized
        # builds; a debug run prints its numbers but compiles the assertions out.
        run: swift test -c release --package-path DirnexCore --filter PerformanceBudget

  app:
    name: App (xcodebuild test)
    runs-on: macos-26
    # The watchdog below stops a stuck run at 25 minutes; this is only the backstop. Without it a
    # stuck run sits for GitHub's six hours, as on 2026-09-30 and 2026-10-01.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Build & test
        # A test that never returns stops the whole suite without failing anything: on 2026-09-30
        # every test went quiet 5 seconds in and nothing printed for four hours. The runner has
        # only three cooperative threads, so three tests blocked on a child process are enough to
        # freeze every other test (the 2026-10-02 sample). So the run is watched, and past 25
        # minutes the test host's threads are sampled and the screen captured (in the `hang`
        # artifact) before it's stopped. The main thread's stack goes into the log too.
        env:
          # Reaches the tests as `DIRNEX_CI` (xcodebuild strips the prefix), for the suites that
          # must not run on a CI machine, such as SFTPPasswordMechanismTests.
          TEST_RUNNER_DIRNEX_CI: "1"
        run: |
          set -o pipefail
          xcodebuild test \
            -project Dirnex.xcodeproj \
            -scheme Dirnex \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult &
          tests=$!
          deadline=$((SECONDS + 25 * 60))
          while kill -0 "$tests" 2>/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The app tests ran past 25 minutes. Sampling the test host, then stopping them."
              mkdir -p hang
              screencapture -x hang/screen.png || echo "No screenshot (no Screen Recording permission?)."
              for pid in $(pgrep -x Dirnex); do
                sample "$pid" 10 -file "hang/sample-$pid.txt" || true
                echo "::group::Main thread of Dirnex $pid"
                awk '/^ +[0-9]+ Thread_/ { on = /com.apple.main-thread/ } /^Total number/ { on = 0 } on' \
                  "hang/sample-$pid.txt" | head -200 || true
                echo "::endgroup::"
                # The tests that held the run on 2026-10-02 were each waiting for a child process
                # (bsdtar, sftp) whose exit never reached them. Whether such a child is still
                # running (S, R), exited but not reaped (Z), or gone says where the exit was lost.
                echo "::group::Child processes of Dirnex $pid"
                ps -A -o pid=,ppid=,stat=,etime=,command= | awk -v parent="$pid" '$2 == parent' || true
                echo "::endgroup::"
                for child in $(pgrep -P "$pid"); do
                  sample "$child" 3 -file "hang/sample-child-$child.txt" > /dev/null 2>&1 || true
                done
              done
              kill "$tests" || true
              pkill -x Dirnex || true
              exit 1
            fi
            sleep 20
          done
          wait "$tests"
      # Reads the .stringsdata the build above emitted, so it runs after it rather than in the
      # lint job. A key the compiler extracted but the catalog never received renders in English
      # inside every translated build, with no error and a perfect English screenshot.
      - name: Every extracted string is in the catalog
        run: python3 scripts/check_localization_keys.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
      - name: Upload what a stuck run left
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hang
          path: hang
          if-no-files-found: ignore

  lint:
    name: Lint (SwiftFormat + SwiftLint)
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install swiftformat swiftlint
      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .
      - name: SwiftLint
        run: swiftlint --strict
      # A pure source scan, so it needs no build. `NSAlert` binds Escape by matching the byte
      # string "Cancel", so an alert that skips `enableEscapeToCancel()` is Escape-dead in every
      # language but English — invisible at build time and in any English screenshot.
      - name: Every alert can be dismissed with Escape
        run: python3 scripts/check_alert_escape.py
      # Also a pure source scan. AppKit's bare text-field initializers wrap, so a name longer than
      # the field hides its tail on a second line the field is too short to show — perfect in any
      # screenshot taken with a short name, and green in both suites.
      - name: Every entry field scrolls instead of wrapping
        run: python3 scripts/check_single_line_fields.py
      # Also a pure source scan. A defaults suite named with a fresh UUID leaves a plist in
      # ~/Library/Preferences on every test run, even after `removePersistentDomain` — 19,046 of
      # them had built up by 2026-09-13, with nothing in the repo or either suite to show it.
      - name: Test defaults suites have fixed names
        run: python3 scripts/check_test_defaults_suites.py
